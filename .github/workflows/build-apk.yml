name: Build Divya APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP="$(ls -t DivyaAI_*.zip | head -1)"
          echo "Using $ZIP"
          unzip -o "$ZIP"
          ls

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: DivyaAI
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain --stacktrace 2>&1 | tee ../build.log

      - name: Show errors only
        if: failure()
        run: |
          echo "===== KOTLIN / COMPILE ERRORS ====="
          grep -E "^e: " build.log | head -40 || true
          echo "===== WHAT WENT WRONG ====="
          grep -A6 "What went wrong" build.log | head -30 || true

      - uses: actions/upload-artifact@v4
        with:
          name: DivyaAI-apk
          path: DivyaAI/app/build/outputs/apk/debug/app-debug.apk
