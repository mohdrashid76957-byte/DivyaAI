name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project
        id: proj
        run: |
          PROJ=$(find . -name settings.gradle.kts -not -path './_unz/*' | head -n1)
          if [ -z "$PROJ" ]; then
            Z=$(ls -v *.zip 2>/dev/null | grep -v apk | tail -n1)
            unzip -q "$Z" -d _unz
            PROJ=$(find _unz -name settings.gradle.kts | head -n1)
          fi
          echo "dir=$(dirname "$PROJ")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Give Gradle more memory
        run: echo "org.gradle.jvmargs=-Xmx3g" >> "${{ steps.proj.outputs.dir }}/gradle.properties"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DivyaAI-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
