name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project
        id: proj
        run: |
          echo "Repo mein ye files hain:"; ls -la
          USE=""
          for Z in *.zip; do
            [ -e "$Z" ] || continue
            if [ "$(unzip -Z1 "$Z" | grep -c 'NeonHome.kt')" -gt 0 ]; then USE="$Z"; fi
          done
          if [ -n "$USE" ]; then
            echo "NAYA ZIP MILA: $USE"
            unzip -q "$USE" -d _unz
            PROJ=$(find _unz -name settings.gradle.kts | head -n1)
          else
            PROJ=$(find . -name settings.gradle.kts -not -path './_unz/*' | head -n1)
          fi
          DIR=$(dirname "$PROJ")
          echo "PROJECT FOLDER: $DIR"
          grep -n "versionName" "$DIR/app/build.gradle.kts" || true
          if [ ! -f "$DIR/app/src/main/java/com/divya/ai/NeonHome.kt" ]; then
            echo "ERROR: Repo mein v1.3 (NeonHome.kt wala) project nahi mila. Naya v1.3 zip upload karo."
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Give Gradle more memory
        run: echo "org.gradle.jvmargs=-Xmx3g" >> "${{ steps.proj.outputs.dir }}/gradle.properties"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DivyaAI-v1.3-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
