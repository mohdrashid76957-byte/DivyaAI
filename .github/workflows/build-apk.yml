name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project (sabse naya versionCode wala zip)
        id: proj
        run: |
          echo "Repo mein ye files hain:"; ls -la
          BEST=""; BESTVC=-1; BESTDIR=""
          i=0
          for Z in *.zip*; do
            [ -f "$Z" ] || continue
            if [ "$(unzip -Z1 "$Z" 2>/dev/null | grep -c 'NeonHome.kt')" -eq 0 ]; then continue; fi
            i=$((i+1)); D="_unz/$i"; mkdir -p "$D"; unzip -q "$Z" -d "$D"
            G=$(find "$D" -path '*app/build.gradle.kts' | head -n1)
            VC=$(grep -oE 'versionCode = [0-9]+' "$G
            
